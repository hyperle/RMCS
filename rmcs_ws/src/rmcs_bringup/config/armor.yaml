rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::armordetector::SingleDetector -> armor_detect

armor_detect:
  ros__parameters:
    invert_image: false
    exposure_time: 5000
    gain: 1.0
    binary_threshold: 130
    min_contour_area: 100
    max_angle_diff: 160.0
    min_length_ratio: 0.5
    max_length_ratio: 2.0
    red_lower: [0, 50, 50]
    red_upper: [255, 255, 255]
    blue_lower: [100, 100, 100]
    blue_upper: [140, 255, 255]