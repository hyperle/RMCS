rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::armordetector::ArmorPredictor -> armor_detect

armor_detect:
  ros__parameters:
    invert_image: false
    exposure_time: 5000
    gain: 1.0
    brightness_threshold: 100
    enermy_color: red
    red_lower1: [0, 100, 100]   
    red_upper1: [40, 255, 255]   
    red_lower2: [160, 100, 100]  
    red_upper2: [180, 255, 255] 
    blue_lower: [40, 0, 0]   
    blue_upper: [160, 255, 255]  