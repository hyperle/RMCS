rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - "rmcs_core::hardware::Gantry -> gantry_hardware"
      - "rmcs_core::controller::GantryController -> gantry_controller"
      - "rmcs_core::controller::GantryInformation -> gantry_information"
      - "rmcs_core::broadcaster::ValueBroadcaster -> Value_Broadcaster"

gantry_hardware:
  ros__parameters:
    usb_pid_bottom_board: -1

gantry_controller:
  ros__parameters: {}

gantry_information:
  ros__parameters:
    left_position_kp: 1.2
    left_position_ki: 0.003
    left_position_kd: 0.08
    left_position_integral_min: -3.0
    left_position_integral_max: 3.0
    left_position_output_min: -15.0
    left_position_output_max: 15.0

    right_position_kp: 1.2
    right_position_ki: 0.003
    right_position_kd: 0.08
    right_position_integral_min: -3.0
    right_position_integral_max: 3.0
    right_position_output_min: -15.0
    right_position_output_max: 15.0

    yaw_position_kp: 0.6
    yaw_position_ki: 0.001
    yaw_position_kd: 0.04
    yaw_position_integral_min: -2.0
    yaw_position_integral_max: 2.0
    yaw_position_output_min: -8.0
    yaw_position_output_max: 8.0

    # 内环速度控制PID - 较快响应，保证动态性能
    left_velocity_kp: 1.5
    left_velocity_ki: 0.01
    left_velocity_kd: 0.05
    left_velocity_integral_min: -5.0
    left_velocity_integral_max: 5.0
    left_velocity_output_min: -8.0
    left_velocity_output_max: 8.0

    right_velocity_kp: 1.5
    right_velocity_ki: 0.01
    right_velocity_kd: 0.05
    right_velocity_integral_min: -5.0
    right_velocity_integral_max: 5.0
    right_velocity_output_min: -8.0
    right_velocity_output_max: 8.0

    yaw_velocity_kp: 0.8
    yaw_velocity_ki: 0.005
    yaw_velocity_kd: 0.02
    yaw_velocity_integral_min: -3.0
    yaw_velocity_integral_max: 3.0
    yaw_velocity_output_min: -5.0
    yaw_velocity_output_max: 5.0

    # 同步控制PID
    sync_kp: 0.8
    sync_ki: 0.002
    sync_kd: 0.03
    sync_integral_min: -2.0
    sync_integral_max: 2.0
    sync_output_min: -3.0
    sync_output_max: 3.0

    # 前馈和限制参数
    position_ff_gain: 0.05
    velocity_ff_gain: 0.08
    max_torque: 8.0
    max_sync_compensation: 2.0

    # 振荡检测参数
    oscillation_threshold_count: 5

Value_Broadcaster:
  ros__parameters:
    forward_list:
      - "/gantry/control/angle"
      - "/gantry/left/angle"
      - "/gantry/left/velocity"
      - "/gantry/right/angle"
      - "/gantry/right/velocity"
      - "/gantry/left/filtered_velocity"
      - "/gantry/right/filtered_velocity"
      - "/gantry/yaw/filtered_velocity"
      - "/gantry/left/control_torque"
      - "/gantry/right/control_torque"
      - "/gantry/yaw/control_torque"